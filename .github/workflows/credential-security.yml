name: Validate server-side album key
on: [pull_request]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          LASTFM_API_KEY: build-only-dummy-secret-for-leak-test
      - name: Ensure private key is absent from client bundle
        run: |
          if grep -R -F 'build-only-dummy-secret-for-leak-test' dist; then
            echo 'Private environment value was bundled'
            exit 1
          fi
